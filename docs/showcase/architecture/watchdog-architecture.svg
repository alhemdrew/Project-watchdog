<svg width="1400" height="920" viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Project Watchdog architecture</title>
  <desc id="desc">Diagram of the live Watchdog app: web frontend, API layer, Postgres and Redis, and core modules for events, evidence, moderation, authorization, maps, and search.</desc>
  <defs>
    <style>
      .bg { fill: #f5f3fa; }
      .panel { fill: #ffffff; stroke: #d9d2ee; stroke-width: 2; }
      .soft { fill: #f1edf9; stroke: #d9d2ee; stroke-width: 2; }
      .primary { fill: #e9e4f8; stroke: #7f64d5; stroke-width: 2; }
      .accent { fill: #eaf4f2; stroke: #2b7a6c; stroke-width: 2; }
      .warn { fill: #f7efe7; stroke: #d07a25; stroke-width: 2; }
      .danger { fill: #f9ebed; stroke: #c43d4c; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; fill: #271f34; }
      .muted { fill: #5a5a70; }
      .label { font-size: 14px; font-weight: 600; }
      .node { font-size: 22px; font-weight: 700; }
      .small { font-size: 15px; }
      .arrow { stroke: #5d5a76; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .dash { stroke: #7a728f; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrowHead); }
      .thin { stroke: #5d5a76; stroke-width: 2; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#5d5a76"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="920"/>
  <text x="700" y="64" text-anchor="middle" class="text node" style="font-size:32px;">Project Watchdog architecture</text>

  <rect class="panel" x="80" y="120" width="260" height="220" rx="18"/>
  <text x="210" y="155" text-anchor="middle" class="text label">Users and contributors</text>
  <rect class="soft" x="110" y="185" width="200" height="58" rx="12"/>
  <text x="210" y="222" text-anchor="middle" class="text small">Community reporters</text>
  <rect class="soft" x="110" y="255" width="200" height="58" rx="12"/>
  <text x="210" y="292" text-anchor="middle" class="text small">Moderators and stewards</text>

  <rect class="primary" x="420" y="120" width="280" height="220" rx="18"/>
  <text x="560" y="155" text-anchor="middle" class="text label">Web frontend</text>
  <text x="560" y="202" text-anchor="middle" class="text small">Next.js App Router</text>
  <text x="560" y="235" text-anchor="middle" class="text small">Home, map, events, report, profile</text>
  <text x="560" y="268" text-anchor="middle" class="text small">search, community, moderation</text>
  <text x="560" y="301" text-anchor="middle" class="text small">Location-aware discovery UI</text>

  <rect class="accent" x="780" y="120" width="270" height="220" rx="18"/>
  <text x="915" y="155" text-anchor="middle" class="text label">API backend</text>
  <text x="915" y="202" text-anchor="middle" class="text small">FastAPI + SQLAlchemy</text>
  <text x="915" y="235" text-anchor="middle" class="text small">Auth and user access</text>
  <text x="915" y="268" text-anchor="middle" class="text small">Event, report, and evidence APIs</text>
  <text x="915" y="301" text-anchor="middle" class="text small">Moderation and verification routes</text>

  <rect class="warn" x="1120" y="120" width="200" height="220" rx="18"/>
  <text x="1220" y="155" text-anchor="middle" class="text label">Realtime</text>
  <text x="1220" y="202" text-anchor="middle" class="text small">WebSocket signal updates</text>
  <text x="1220" y="235" text-anchor="middle" class="text small">Live feed refresh</text>
  <text x="1220" y="268" text-anchor="middle" class="text small">Connected event stream</text>
  <text x="1220" y="301" text-anchor="middle" class="text small">Network state awareness</text>

  <path class="arrow" d="M340 230 H420"/>
  <path class="arrow" d="M700 230 H780"/>
  <path class="arrow" d="M1050 230 H1120"/>

  <rect class="soft" x="160" y="430" width="250" height="210" rx="18"/>
  <text x="285" y="470" text-anchor="middle" class="text label">Event intelligence</text>
  <text x="285" y="515" text-anchor="middle" class="text small">Incident lifecycle</text>
  <text x="285" y="545" text-anchor="middle" class="text small">Source classification</text>
  <text x="285" y="575" text-anchor="middle" class="text small">Location precision and region scope</text>
  <text x="285" y="605" text-anchor="middle" class="text small">Status transitions</text>

  <rect class="soft" x="475" y="430" width="250" height="210" rx="18"/>
  <text x="600" y="470" text-anchor="middle" class="text label">Evidence and reports</text>
  <text x="600" y="515" text-anchor="middle" class="text small">Media attachment flow</text>
  <text x="600" y="545" text-anchor="middle" class="text small">Corroboration history</text>
  <text x="600" y="575" text-anchor="middle" class="text small">Source context</text>
  <text x="600" y="605" text-anchor="middle" class="text small">Review records</text>

  <rect class="soft" x="790" y="430" width="250" height="210" rx="18"/>
  <text x="915" y="470" text-anchor="middle" class="text label">Verification and moderation</text>
  <text x="915" y="515" text-anchor="middle" class="text small">Review queue</text>
  <text x="915" y="545" text-anchor="middle" class="text small">Revocation and correction</text>
  <text x="915" y="575" text-anchor="middle" class="text small">Contributor standing</text>
  <text x="915" y="605" text-anchor="middle" class="text small">Trust-aware decisions</text>

  <rect class="soft" x="1105" y="430" width="240" height="210" rx="18"/>
  <text x="1225" y="470" text-anchor="middle" class="text label">Map and search</text>
  <text x="1225" y="515" text-anchor="middle" class="text small">MapLibre geospatial layer</text>
  <text x="1225" y="545" text-anchor="middle" class="text small">Region hierarchy</text>
  <text x="1225" y="575" text-anchor="middle" class="text small">Discovery and filtering</text>
  <text x="1225" y="605" text-anchor="middle" class="text small">Area-aware search flow</text>

  <path class="dash" d="M915 340 L915 430"/>
  <path class="thin" d="M600 340 L600 430"/>
  <path class="thin" d="M285 340 L285 430"/>
  <path class="thin" d="M1225 340 L1225 430"/>

  <rect class="danger" x="300" y="700" width="420" height="150" rx="18"/>
  <text x="510" y="740" text-anchor="middle" class="text label">PostgreSQL + PostGIS</text>
  <text x="510" y="780" text-anchor="middle" class="text small">Stored events, reports, users,</text>
  <text x="510" y="806" text-anchor="middle" class="text small">evidence metadata, moderation records</text>

  <rect class="danger" x="760" y="700" width="330" height="150" rx="18"/>
  <text x="925" y="740" text-anchor="middle" class="text label">Redis</text>
  <text x="925" y="780" text-anchor="middle" class="text small">Realtime coordination and event updates</text>
  <text x="925" y="806" text-anchor="middle" class="text small">Live signal synchronization</text>

  <path class="arrow" d="M915 340 L915 410"/>
  <path class="arrow" d="M510 640 L510 700"/>
  <path class="arrow" d="M925 640 L925 700"/>
  <path class="thin" d="M915 640 L915 700"/>
</svg>
